<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FirmSight — Engineering Memory</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d10; --surface:#111419; --raised:#171b21; --text:#f4f5f7; --muted:#9ba3ae; --border:rgba(255,255,255,.1); --accent:#5a9dff; --warn:#e8ae51; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px Inter,system-ui,sans-serif; }
    main { max-width:1120px; margin:0 auto; padding:40px 24px 72px; } header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; } h1 { font-size:24px; margin:0 } h2 { font-size:15px; margin:0 0 16px } .tag { color:var(--muted) } .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; } .panel { background:color-mix(in srgb,var(--surface) 86%,transparent); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:0 10px 35px rgba(0,0,0,.16); } label { display:block; margin:12px 0 5px; color:var(--muted); font-size:12px } input,select,textarea,button { font:inherit; border-radius:8px; } input,select,textarea { width:100%; color:var(--text); background:var(--bg); border:1px solid var(--border); padding:9px; } textarea { min-height:84px; resize:vertical } button { border:1px solid var(--border); color:var(--text); background:var(--raised); padding:8px 10px; cursor:pointer } button.primary { background:var(--accent); color:#071426; border-color:transparent } .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px } .memory { border-top:1px solid var(--border); padding:14px 0 } .memory:first-child { border-top:0 } .memory p { margin:7px 0; line-height:1.45 } .meta { color:var(--muted); font-size:12px } .status { color:var(--warn); font-size:12px; font-weight:600 } .conflicts { border:1px solid color-mix(in srgb,var(--warn) 55%,transparent); background:color-mix(in srgb,var(--warn) 8%,var(--surface)); border-radius:10px; padding:12px; margin:0 0 16px } .conflicts:empty { display:none } #message { min-height:20px; color:var(--muted); margin:12px 0 0 } @media(max-width:760px){ .grid{grid-template-columns:1fr} main{padding:24px 14px} }
  </style>
</head>
<body><main>
  <header><div><h1>FirmSight <span class="tag">/ Engineering Memory</span></h1><p class="tag">Engineer-approved knowledge for evidence-based firmware review.</p></div><input id="project" value="ground-checker" aria-label="Project ID" style="width:180px"></header>
  <div class="grid"><section class="panel"><h2>Suggested lesson</h2><p class="tag">A proposal is not used in analysis until an engineer saves it.</p>
    <label>Memory type</label><select id="type"><option>ENGINEERING_FACT</option><option>DESIGN_INTENT</option><option>LESSON_LEARNED</option><option>REJECTED_FINDING</option><option>ACCEPTED_FINDING</option><option>ENGINEERING_PATTERN</option></select>
    <label>Statement</label><textarea id="statement" placeholder="ADS1115 is exclusively accessed by measurement_task."></textarea>
    <label>Scope</label><select id="scope"><option value="PROJECT">Project</option><option value="COMPONENT">Component</option><option value="SYMBOL">Symbol</option></select>
    <label>Scope target (component or symbol)</label><input id="target" placeholder="measurement">
    <label>Evidence symbol</label><input id="symbol" placeholder="ads1115_read">
    <label>Engineer rationale</label><textarea id="note" placeholder="Confirmed during review."></textarea>
    <div class="toolbar"><button class="primary" id="propose">Propose lesson</button><button id="save" hidden>Save lesson</button><button id="ignore" hidden>Ignore</button></div><div id="message"></div>
  </section><section class="panel"><h2>Approved memory</h2><div class="toolbar"><button id="refresh">Refresh</button><button id="active">Active context</button><select id="status-filter" aria-label="Filter memory status" style="width:auto"><option value="">All statuses</option><option>ACTIVE</option><option>NEEDS_REVALIDATION</option><option>SUPERSEDED</option><option>DISABLED</option></select></div><div id="conflicts" class="conflicts" aria-live="polite"></div><div id="memories" aria-live="polite"></div><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><h2>Revalidate from source index</h2><p class="tag">Record a newly indexed call to challenge exclusive-ownership memory.</p><label>Referenced symbol</label><input id="observed-symbol" placeholder="ads1115_read"><label>New caller</label><input id="observed-caller" placeholder="calibration_task"><label>File and line (optional)</label><div class="toolbar"><input id="observed-file" placeholder="main/calibration.c"><input id="observed-line" type="number" min="1" placeholder="17" style="max-width:84px"></div><label>Commit SHA (optional)</label><input id="observed-commit" placeholder="abc123"><button id="revalidate">Check memory conflicts</button></section></div>
</main><script>
  const $=id=>document.getElementById(id), project=()=>$('project').value.trim(), projectPath=()=>encodeURIComponent(project());
  const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  async function request(path, options={}) { const r=await fetch(path,options); const data=r.status===204?null:await r.json(); if(!r.ok)throw new Error(data?.detail||'Request failed'); return data; }
  function show(text){$('message').textContent=text}
  function render(items){$('memories').innerHTML=items.length?items.map(m=>`<article class="memory"><strong>${esc(m.type.replaceAll('_',' '))}</strong> <span class="status">${esc(m.status)}</span><p>${esc(m.statement)}</p><div class="meta">${esc(m.scope.type.toLowerCase())} · ${esc(m.scope.component||m.scope.symbol||'entire project')} · evidence: ${m.evidence.map(e=>esc(e.symbol)).join(', ')}</div><p><button onclick="reviewMemory('${esc(m.id)}')">Review</button> <button onclick="updateMemory('${esc(m.id)}')">Update</button> <button onclick="disableMemory('${esc(m.id)}')">Disable</button></p></article>`).join(''):'<p class="tag">No approved engineering memory in this view.</p>'}
  async function load(active=false){try{const filter=$('status-filter').value;const path=active?`/api/projects/${projectPath()}/memory/context`:`/api/projects/${projectPath()}/memory${filter?`?status=${encodeURIComponent(filter)}`:''}`;render(active?(await request(path)).memories:await request(path))}catch(e){show(e.message)}}
  async function disableMemory(id){try{await request(`/api/memory/${id}/disable`,{method:'POST'});show('Memory disabled. It is excluded from analysis context.');load()}catch(e){show(e.message)}} window.disableMemory=disableMemory;
  async function reviewMemory(id){try {const events=await request(`/api/memory/${id}/revalidation-events`);$('conflicts').innerHTML=events.length?`<strong>Memory conflict history</strong>${events.map(event=>`<p>${esc(event.reason)}<br><span class="meta">${esc(event.observation.file||'source index')} ${event.observation.line?`:${esc(event.observation.line)}`:''} · ${esc(event.commit_sha||'uncommitted')}</span></p>`).join('')}`:'<span class="tag">No revalidation conflicts recorded for this memory.</span>'} catch(e){show(e.message)}} window.reviewMemory=reviewMemory;
  async function updateMemory(id){const statement=window.prompt('Update the engineering memory statement. Saving reactivates this memory after review.');if(!statement)return;try{await request(`/api/memory/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({statement,status:'ACTIVE'})});show('Memory updated and reactivated after engineer review.');$('conflicts').textContent='';load()}catch(e){show(e.message)}} window.updateMemory=updateMemory;
  let pendingProposal=null;
  function proposalBody(){const scope=$('scope').value,target=$('target').value.trim(),body={type:$('type').value,statement:$('statement').value.trim(),scope:{type:scope},evidence:[{symbol:$('symbol').value.trim()}],source:{type:'ENGINEER_AUTHORED',engineer_note:$('note').value.trim()},proposed_by:'ENGINEER'}; if(scope==='COMPONENT')body.scope.component=target; if(scope==='SYMBOL')body.scope.symbol=target; return body}
  $('propose').onclick=async()=>{try {const body=proposalBody(), method=pendingProposal?'PATCH':'POST', path=pendingProposal?`/api/memory/proposals/${pendingProposal.id}`:`/api/projects/${projectPath()}/memory/proposals`; pendingProposal=await request(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); $('save').hidden=false;$('ignore').hidden=false;show('Candidate ready. Review or edit the fields, then explicitly save the lesson.')} catch(e){show(e.message)} };
  $('save').onclick=async()=>{try {await request(`/api/memory/proposals/${pendingProposal.id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved_by:'Engineer'})});pendingProposal=null;$('save').hidden=true;$('ignore').hidden=true;show('Lesson saved as active engineering memory.');load()}catch(e){show(e.message)}};
  $('ignore').onclick=async()=>{try {await request(`/api/memory/proposals/${pendingProposal.id}`,{method:'DELETE'});pendingProposal=null;$('save').hidden=true;$('ignore').hidden=true;show('Proposal ignored; no engineering memory was saved.')}catch(e){show(e.message)}};
  $('revalidate').onclick=async()=>{const line=Number($('observed-line').value)||undefined,observation={symbol:$('observed-symbol').value.trim(),caller:$('observed-caller').value.trim(),file:$('observed-file').value.trim()||undefined,line};try{const result=await request(`/api/projects/${projectPath()}/memory/revalidate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({commit_sha:$('observed-commit').value.trim()||undefined,observations:[observation]})});$('conflicts').innerHTML=result.conflicts.length?`<strong>Memory conflict</strong>${result.conflicts.map(conflict=>`<p>${esc(conflict.memory.statement)}</p><p>${esc(conflict.reason)}</p><p><button onclick="reviewMemory('${esc(conflict.memory.id)}')">Review evidence</button> <button onclick="updateMemory('${esc(conflict.memory.id)}')">Update memory</button> <button onclick="disableMemory('${esc(conflict.memory.id)}')">Disable</button></p>`).join('')}`:`<span class="tag">Checked ${esc(result.checked)} active memories. No conflict was found.</span>`;load()}catch(e){show(e.message)}};
  $('refresh').onclick=()=>load(); $('active').onclick=()=>load(true); $('status-filter').onchange=()=>load(); load();
</script></body></html>
